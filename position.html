<!DOCTYPE html>
<html>
  <head>
    <title>Position Practice</title>
  </head>
  <body style="height: 3000px; padding-top: 110px; padding-left: 110px;">
    <div style="background-color: black; color: white; position: fixed; top: 0; left: 0; right: 0; height: 100px; z-index: 1;">
      header
    </div>
    <div style="background-color: green; color: white; position: fixed; top: 100px; left: 0; bottom: 0; width: 100px;">
      sidebar
      
      <div style="position: absolute; background-color: red; color: white; right: 0; top: 0;">
      X
      </div>
    </div>
    <div style="position: absolute; background-color: red; color: white; right: 10px; top: 110px;">
      absolute
    </div>
    <div style="background-color: lightblue; height: 200px; width: 200px;">
      div1
    </div>
    <div style="background-color: lightpink; height: 200px; width: 200px; position: relative;">
      div2
      <div style="position: absolute; background-color: black; color: white; right: 10px; bottom: 10px;">
        5:00
      </div>
    </div>
  </body>
</html>
